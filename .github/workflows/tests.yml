# GitHubに納める(プッシュする)たびに、変換のテストを自動で実行する。
# 赤(失敗)になったら、直前の変更で変換結果が変わっている。README の「自動テスト」を参照。
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 部品をそろえる
        run: pip install -r requirements.txt httpx
      - name: 変換の単体テスト
        run: python tests/test_sanei_converter.py
      - name: 架空サンプルを正解と比較
        run: python tests/test_samples.py
      - name: 勘太郎パソコンの受け取り係のAPI
        run: python tests/test_agent_api.py
      - name: GAS 版の変換（アプリの正解と1バイトずつ比べる）
        run: node gas/step2_convert/test_converter.js
      - name: GAS 版の全体（Gmail・ドライブ・受け取り口の偽物の上で）
        run: node gas/step2_convert/test_main.js
      - name: GAS 第1回の見本
        run: node gas/step1_save/test_save_sanei_csv.js
      - name: 勘太郎のパソコンの受け取り係（GAS 版）
        shell: pwsh
        run: ./tools/kantaro_pc/test_kantaro_gas_agent.ps1
      - name: 移し係（Windows）
        shell: pwsh
        run: ./tools/windows/test_kantaro_mover.ps1
