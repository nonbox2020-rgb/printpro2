# 変換ルールをわざと変えたとき(例: 変換表に寸法を足した)に、テストの正解を作り直す。
# GitHub の Actions タブ →「テストの正解を作り直す」→ Run workflow で実行する。
# 作り直した正解はコミットされるので、その差分(変わったCSV)を目で確認すること。
name: テストの正解を作り直す

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 部品をそろえる
        run: pip install -r requirements.txt
      - name: 正解を作り直す
        run: python tests/test_samples.py --update
      - name: 変わった正解をコミットする
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/expected
          if git diff --cached --quiet; then
            echo "正解は変わっていません"
          else
            git commit -m "テストの正解を作り直し（変換ルールの変更に合わせる）"
            git push
          fi
