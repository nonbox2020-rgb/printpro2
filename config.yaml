# =============================================================
# 三映CSV→勘太郎CSV変換アプリ 運用設定
# 変換ルール・35列の定義・CSV-Bの形式は sanei_config.yaml にある。
# このファイルは出力フォルダ・SFTP・サーバーの設定だけ。
# =============================================================

# --- 出力先 ---
output:
  dir: ./data/incoming            # 出力したCSV-Bの置き場所。画面からダウンロードして勘太郎の指定フォルダへ入れる
                                  # (アプリを勘太郎のパソコンで動かす場合は、指定フォルダのパスを書けば直接入る)
  done_file: true                 # .done ファイル(書き終わりの合図)も作るか
  done_suffix: ".done"
  archive_dir: ./data/archive     # 取込済のCSVを移すフォルダ(画面の「取込済」タブ)
  failed_dir: ./data/failed       # エラー時の退避先(画面の「エラー」タブ)

# --- SFTP送信(今は使わない。勘太郎はパソコンの指定フォルダから取り込む) ---
sftp:
  push_enabled: false             # true にするとアプリ側からSFTPで送信(paramiko)
  host: ""
  port: 22
  username: ""
  private_key_path: ""            # SSH鍵認証(鍵ファイルのパス)
  remote_dir: "/incoming/orders/"

server:
  host: 0.0.0.0
  port: 8000
